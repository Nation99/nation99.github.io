name: Daily publish

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      publish_date:
        description: "Test date in YYYY-MM-DD (Africa/Harare). Leave empty for today."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: daily-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build the site for the current CAT date
        working-directory: source
        env:
          PUBLISH_DATE: ${{ github.event.inputs.publish_date }}
        run: |
          if [ -z "$PUBLISH_DATE" ]; then
            unset PUBLISH_DATE
          fi
          npm run build

      - name: Copy the build to the site root
        run: |
          cp ads.txt /tmp/production-ads.txt
          cp -R source/dist/. .
          cp /tmp/production-ads.txt ads.txt

      - name: Commit and push when the site changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No site changes to publish."
            exit 0
          fi
          git commit -m "Publish scheduled articles"
          git push
